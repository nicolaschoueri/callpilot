name: Build Friendly Ava Voice

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-friendly-ava.yml"

permissions:
  contents: write

jobs:
  build-friendly-ava:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install neural voice generator
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts
          mkdir -p audio

      - name: Generate smoother friendly Ava voice
        shell: bash
        run: |
          set -e
          voice="en-US-JennyNeural"

          speak () {
            n="$1"
            text="$2"
            edge-tts --voice "$voice" --rate="-4%" --pitch="-1Hz" --text "$text" --write-media "audio/friendly${n}.mp3"
          }

          speak 1 "Hi, thanks for calling CallPilot Trades. This is Ava. How can I help you today?"
          speak 2 "Absolutely, I can help with that. Is this an emergency, or would a regular appointment work for you?"
          speak 3 "Perfect. What city are you located in?"
          speak 4 "Great. And may I have your name for the service request?"
          speak 5 "I have Friday, October 2nd at 10:30 in the morning, or 2 in the afternoon. I also have Saturday, October 3rd at 9 in the morning. Which works best for you?"
          speak 6 "Perfect. You're all set for Friday, October 2nd at 10:30 in the morning. Your appointment is confirmed, and you'll receive a message with the details. Thanks for calling CallPilot Trades. Have a great day."
          speak 7 "Perfect. You're all set for Friday, October 2nd at 2 in the afternoon. Your appointment is confirmed, and you'll receive a message with the details. Thanks for calling CallPilot Trades. Have a great day."
          speak 8 "Perfect. You're all set for Saturday, October 3rd at 9 in the morning. Your appointment is confirmed, and you'll receive a message with the details. Thanks for calling CallPilot Trades. Have a great day."
          speak 9 "Perfect. You're all set. Your appointment is confirmed, and you'll receive a message with the details. Thanks for calling CallPilot Trades. Have a great day."

      - name: Commit friendly voice clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/friendly*.mp3
          git commit -m "Add smoother friendly Ava voice clips" || exit 0
          git push
