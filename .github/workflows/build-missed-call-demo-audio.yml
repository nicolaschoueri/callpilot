name: Build missed-call demo audio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-missed-call-demo-audio.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install voice generator
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Generate matching Ava demo clips
        run: |
          python - <<'PY'
          import asyncio, os
          import edge_tts

          async def save(text, voice, rate, pitch, path):
              os.makedirs("audio", exist_ok=True)
              await edge_tts.Communicate(text, voice, rate=rate, pitch=pitch).save(path)

          async def main():
              en_voice="en-US-AriaNeural"
              fr_voice="fr-CA-SylvieNeural"

              await save(
                  "Hi, thanks for calling CallPilot Trades. John isn't available right now, but I can help you. What seems to be the problem?",
                  en_voice, "-12%", "-6Hz", "audio/lux-missed-greeting.mp3"
              )
              await save(
                  "Bonjour, merci d'avoir appelé CallPilot Trades. John n'est pas disponible en ce moment, mais je peux vous aider. Quel est le problème?",
                  fr_voice, "-5%", "-2Hz", "audio/fr-missed-greeting.mp3"
              )
              await save(
                  "I understand. Since this is an emergency, I can check for a same-day dispatch. I have a 1 to 3 P.M. window, a 3 to 5 P.M. window, or the first available technician today. Which would you prefer?",
                  en_voice, "-12%", "-6Hz", "audio/lux-emergency.mp3"
              )
              await save(
                  "Perfect. Your emergency service window is confirmed for today between 1 P.M. and 3 P.M. You will receive a confirmation message with the details. Thank you for calling CallPilot Trades.",
                  en_voice, "-12%", "-6Hz", "audio/lux-final-emg-1315.mp3"
              )
              await save(
                  "Perfect. Your emergency service window is confirmed for today between 3 P.M. and 5 P.M. You will receive a confirmation message with the details. Thank you for calling CallPilot Trades.",
                  en_voice, "-12%", "-6Hz", "audio/lux-final-emg-1517.mp3"
              )
              await save(
                  "Perfect. The first available technician will be dispatched today. You will receive a confirmation message with the details. Thank you for calling CallPilot Trades.",
                  en_voice, "-12%", "-6Hz", "audio/lux-final-emg-first.mp3"
              )

          asyncio.run(main())
          PY

      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/build-missed-call-demo-audio.yml
          git add -A
          git commit -m "Add missed-call demo Ava audio" || exit 0
          git push
