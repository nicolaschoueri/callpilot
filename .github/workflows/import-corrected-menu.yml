name: Import corrected French menu

on:
  push:
    paths:
      - '.github/workflows/import-corrected-menu.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import corrected menu
        env:
          SOURCE_B64: 
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os, urllib.request
          url=base64.b64decode(os.environ["SOURCE_B64"]).decode()
          urllib.request.urlretrieve(url, "audio/fr-menu.mp3")
          PY
      - name: Commit corrected menu
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/import-corrected-menu.yml
          git add -A
          git commit -m "Correct French language menu audio"
          git push
