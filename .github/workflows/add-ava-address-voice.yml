name: Add Ava address voice

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-ava-address-voice.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install voice generator
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts
          mkdir -p audio
      - name: Generate service-address prompt in Ava's exact English voice
        run: |
          edge-tts --voice "en-US-AriaNeural" --rate="-12%" --pitch="-6Hz" \
            --text "Thanks. What is the service address, including the street number and street name?" \
            --write-media "audio/lux-address.mp3"
      - name: Commit address voice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/lux-address.mp3
          git commit -m "Add matching Ava service-address voice" || exit 0
          git push
