name: Rebuild unified French Ava voice

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-french-ava.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install French voice generator
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Generate all French Ava clips with one voice
        run: |
          python - <<'PY'
          import asyncio, os
          import edge_tts

          VOICE = "fr-CA-SylvieNeural"
          RATE = "-5%"
          PITCH = "-2Hz"

          clips = {
              "audio/fr-menu.mp3": "Pour le français, appuyez sur 1.",
              "audio/fr1.mp3": "Bonjour, merci d’avoir appelé CallPilot Trades. Ici Ava. Comment puis-je vous aider aujourd’hui?",
              "audio/fr2.mp3": "Bien sûr, je peux vous aider. Est-ce une urgence ou préférez-vous un rendez-vous régulier?",
              "audio/fr3.mp3": "Parfait. Dans quelle ville êtes-vous situé?",
              "audio/fr-address.mp3": "Merci. Quelle est l’adresse de service, incluant le numéro civique et le nom de la rue?",
              "audio/fr4.mp3": "Très bien. Puis-je avoir votre nom pour la demande de service?",
              "audio/fr5.mp3": "J’ai une disponibilité vendredi à 10 h 30 ou à 14 h, ainsi que samedi à 9 h. Quelle heure vous convient le mieux?",
              "audio/fr-emergency.mp3": "Je comprends. Comme il s’agit d’une urgence, je peux envoyer un technicien aujourd’hui. J’ai une plage de 13 h à 15 h, de 15 h à 17 h, ou je peux envoyer le premier technicien disponible. Que préférez-vous?",
              "audio/fr-final-1030.mp3": "Parfait. Votre rendez-vous est confirmé pour vendredi 2 octobre à 10 h 30. Vous recevrez un message de confirmation avec les détails. Merci d’avoir appelé CallPilot Trades.",
              "audio/fr-final-1400.mp3": "Parfait. Votre rendez-vous est confirmé pour vendredi 2 octobre à 14 h. Vous recevrez un message de confirmation avec les détails. Merci d’avoir appelé CallPilot Trades.",
              "audio/fr-final-sat9.mp3": "Parfait. Votre rendez-vous est confirmé pour samedi 3 octobre à 9 h. Vous recevrez un message de confirmation avec les détails. Merci d’avoir appelé CallPilot Trades.",
              "audio/fr-final-emg-1315.mp3": "Parfait. Votre intervention d’urgence est confirmée aujourd’hui entre 13 h et 15 h. Vous recevrez un message de confirmation avec les détails. Merci d’avoir appelé CallPilot Trades.",
              "audio/fr-final-emg-1517.mp3": "Parfait. Votre intervention d’urgence est confirmée aujourd’hui entre 15 h et 17 h. Vous recevrez un message de confirmation avec les détails. Merci d’avoir appelé CallPilot Trades.",
              "audio/fr-final-emg-first.mp3": "Parfait. Le premier technicien disponible sera envoyé aujourd’hui. Vous recevrez un message de confirmation avec les détails. Merci d’avoir appelé CallPilot Trades.",
              "audio/fr-final-generic.mp3": "Parfait. Votre rendez-vous est confirmé. Vous recevrez un message de confirmation avec les détails. Merci d’avoir appelé CallPilot Trades.",
          }

          async def main():
              os.makedirs("audio", exist_ok=True)
              for path, text in clips.items():
                  await edge_tts.Communicate(text, VOICE, rate=RATE, pitch=PITCH).save(path)

          asyncio.run(main())
          PY

      - name: Point app to the unified French address clip
        run: |
          python - <<'PY'
          from pathlib import Path

          old = """const frAudioFiles=[
            'audio/fr1.mp3',
            'audio/fr2.mp3',
            'audio/fr3.mp3',
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3IoR1qS4iiGiHjjP4U9ed0eUIsB/65655bfd-c21d-45ac-ba01-a3cc0c576a9e.mp3',
            'audio/fr4.mp3',
            'audio/fr5.mp3'
          ];"""
          new = """const frAudioFiles=[
            'audio/fr1.mp3?v=20261001u',
            'audio/fr2.mp3?v=20261001u',
            'audio/fr3.mp3?v=20261001u',
            'audio/fr-address.mp3?v=20261001u',
            'audio/fr4.mp3?v=20261001u',
            'audio/fr5.mp3?v=20261001u'
          ];"""

          for name in ["index.html", "iphone.html", "luxury.html", "friendly.html"]:
              p = Path(name)
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  raise SystemExit(f"Expected French audio block missing in {name}")
              s = s.replace(old, new)
              s = s.replace("const frEmergencyAudio='audio/fr-emergency.mp3';",
                            "const frEmergencyAudio='audio/fr-emergency.mp3?v=20261001u';")
              s = s.replace("'Vendredi 2 oct. • 10 h 30':'audio/fr-final-1030.mp3'",
                            "'Vendredi 2 oct. • 10 h 30':'audio/fr-final-1030.mp3?v=20261001u'")
              s = s.replace("'Vendredi 2 oct. • 14 h':'audio/fr-final-1400.mp3'",
                            "'Vendredi 2 oct. • 14 h':'audio/fr-final-1400.mp3?v=20261001u'")
              s = s.replace("'Samedi 3 oct. • 9 h':'audio/fr-final-sat9.mp3'",
                            "'Samedi 3 oct. • 9 h':'audio/fr-final-sat9.mp3?v=20261001u'")
              s = s.replace("'Aujourd’hui • 13 h–15 h':'audio/fr-final-emg-1315.mp3'",
                            "'Aujourd’hui • 13 h–15 h':'audio/fr-final-emg-1315.mp3?v=20261001u'")
              s = s.replace("'Aujourd’hui • 15 h–17 h':'audio/fr-final-emg-1517.mp3'",
                            "'Aujourd’hui • 15 h–17 h':'audio/fr-final-emg-1517.mp3?v=20261001u'")
              s = s.replace("'Premier technicien disponible aujourd’hui':'audio/fr-final-emg-first.mp3'",
                            "'Premier technicien disponible aujourd’hui':'audio/fr-final-emg-first.mp3?v=20261001u'")
              s = s.replace("generic:'audio/fr-final-generic.mp3'",
                            "generic:'audio/fr-final-generic.mp3?v=20261001u'")
              s = s.replace("a.src='audio/fr-menu.mp3?v=20261001f';",
                            "a.src='audio/fr-menu.mp3?v=20261001u';")
              s = s.replace("lastAudioSrc='audio/fr-menu.mp3?v=20261001f';",
                            "lastAudioSrc='audio/fr-menu.mp3?v=20261001u';")
              p.write_text(s, encoding="utf-8")
          PY

      - name: Commit unified French voice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/rebuild-french-ava.yml
          git add -A
          git commit -m "Unify all French Ava voice clips" || exit 0
          git push
