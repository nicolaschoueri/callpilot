name: Add phone capture to Ava flow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-phone-capture.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install voice generator
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Generate matching phone prompts
        run: |
          python - <<'PY'
          import asyncio, os
          import edge_tts

          async def main():
              os.makedirs("audio", exist_ok=True)

              en = edge_tts.Communicate(
                  "Perfect. And what's the best phone number to reach you?",
                  "en-US-AriaNeural",
                  rate="-12%",
                  pitch="-6Hz"
              )
              await en.save("audio/lux-phone.mp3")

              fr = edge_tts.Communicate(
                  "Parfait. Et quel est le meilleur numéro de téléphone pour vous joindre?",
                  "fr-CA-SylvieNeural",
                  rate="-5%",
                  pitch="-2Hz"
              )
              await fr.save("audio/fr-phone.mp3")

          asyncio.run(main())
          PY

      - name: Add phone step to every CallPilot page
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = ["index.html", "iphone.html", "luxury.html", "friendly.html"]

          old_prompts_en = """const promptsEn = [
            'Hi, thanks for calling CallPilot Trades. This is Ava. How can I help you today?',
            'Absolutely, I can help with that. Is this an emergency, or would a regular appointment work for you?',
            'Perfect. What city are you located in?',
            'Thanks. What is the service address, including the street number and street name?',
            'Great. And may I have your name for the service request?',
            'I have Friday at 10:30 A.M. or 2 P.M., and Saturday at 9 A.M. Which time works best for you?'
          ];"""
          new_prompts_en = """const promptsEn = [
            'Hi, thanks for calling CallPilot Trades. This is Ava. How can I help you today?',
            'Absolutely, I can help with that. Is this an emergency, or would a regular appointment work for you?',
            'Perfect. What city are you located in?',
            'Thanks. What is the service address, including the street number and street name?',
            "Perfect. And what's the best phone number to reach you?",
            'Great. And may I have your name for the service request?',
            'I have Friday at 10:30 A.M. or 2 P.M., and Saturday at 9 A.M. Which time works best for you?'
          ];"""

          old_prompts_fr = """const promptsFr = [
            'Bonjour, merci d’avoir appelé CallPilot Trades. Ici Ava. Comment puis-je vous aider aujourd’hui?',
            'Bien sûr, je peux vous aider. Est-ce une urgence ou préférez-vous un rendez-vous régulier?',
            'Parfait. Dans quelle ville êtes-vous situé?',
            'Merci. Quelle est l’adresse de service, incluant le numéro civique et le nom de la rue?',
            'Très bien. Puis-je avoir votre nom pour la demande de service?',
            'J’ai une disponibilité vendredi à 10 h 30 ou à 14 h, ainsi que samedi à 9 h. Quelle heure vous convient le mieux?'
          ];"""
          new_prompts_fr = """const promptsFr = [
            'Bonjour, merci d’avoir appelé CallPilot Trades. Ici Ava. Comment puis-je vous aider aujourd’hui?',
            'Bien sûr, je peux vous aider. Est-ce une urgence ou préférez-vous un rendez-vous régulier?',
            'Parfait. Dans quelle ville êtes-vous situé?',
            'Merci. Quelle est l’adresse de service, incluant le numéro civique et le nom de la rue?',
            'Parfait. Et quel est le meilleur numéro de téléphone pour vous joindre?',
            'Très bien. Puis-je avoir votre nom pour la demande de service?',
            'J’ai une disponibilité vendredi à 10 h 30 ou à 14 h, ainsi que samedi à 9 h. Quelle heure vous convient le mieux?'
          ];"""

          old_audio_en = """const audioFiles=[
            'audio/lux1.mp3',
            'audio/lux2.mp3',
            'audio/lux3.mp3',
            'audio/lux-address.mp3',
            'audio/lux4.mp3',
            'audio/lux5.mp3'
          ];"""
          new_audio_en = """const audioFiles=[
            'audio/lux1.mp3',
            'audio/lux2.mp3',
            'audio/lux3.mp3',
            'audio/lux-address.mp3',
            'audio/lux-phone.mp3?v=20261001p',
            'audio/lux4.mp3',
            'audio/lux5.mp3'
          ];"""

          old_audio_fr = """const frAudioFiles=[
            'audio/fr1.mp3?v=20261001u',
            'audio/fr2.mp3?v=20261001u',
            'audio/fr3.mp3?v=20261001u',
            'audio/fr-address.mp3?v=20261001u',
            'audio/fr4.mp3?v=20261001u',
            'audio/fr5.mp3?v=20261001u'
          ];"""
          new_audio_fr = """const frAudioFiles=[
            'audio/fr1.mp3?v=20261001u',
            'audio/fr2.mp3?v=20261001u',
            'audio/fr3.mp3?v=20261001u',
            'audio/fr-address.mp3?v=20261001u',
            'audio/fr-phone.mp3?v=20261001p',
            'audio/fr4.mp3?v=20261001u',
            'audio/fr5.mp3?v=20261001u'
          ];"""

          old_choices_fr = """    if(i===3)arr=['123 rue Main','45 boulevard Saint-Charles','789 avenue des Pins'];
              if(i===4)arr=['Nicolas','Jean','Marie','Alex'];
              if(i===5)arr=['Vendredi 2 oct. • 10 h 30','Vendredi 2 oct. • 14 h','Samedi 3 oct. • 9 h'];
              if(i===6)arr=['Aujourd’hui • 13 h–15 h','Aujourd’hui • 15 h–17 h','Premier technicien disponible aujourd’hui'];"""
          new_choices_fr = """    if(i===3)arr=['123 rue Main','45 boulevard Saint-Charles','789 avenue des Pins'];
              if(i===4)arr=['514-555-0123','438-555-0177','450-555-0199'];
              if(i===5)arr=['Nicolas','Jean','Marie','Alex'];
              if(i===6)arr=['Vendredi 2 oct. • 10 h 30','Vendredi 2 oct. • 14 h','Samedi 3 oct. • 9 h'];
              if(i===7)arr=['Aujourd’hui • 13 h–15 h','Aujourd’hui • 15 h–17 h','Premier technicien disponible aujourd’hui'];"""

          old_choices_en = """    if(i===3)arr=['123 Main Street','45 Saint-Charles Boulevard','789 Pine Avenue'];
              if(i===4)arr=['Nicolas','John','Marie','Alex'];
              if(i===5)arr=['Friday, Oct 2 • 10:30 AM','Friday, Oct 2 • 2:00 PM','Saturday, Oct 3 • 9:00 AM'];
              if(i===6)arr=['Dispatch today • 1–3 PM','Dispatch today • 3–5 PM','First available technician today'];"""
          new_choices_en = """    if(i===3)arr=['123 Main Street','45 Saint-Charles Boulevard','789 Pine Avenue'];
              if(i===4)arr=['514-555-0123','438-555-0177','450-555-0199'];
              if(i===5)arr=['Nicolas','John','Marie','Alex'];
              if(i===6)arr=['Friday, Oct 2 • 10:30 AM','Friday, Oct 2 • 2:00 PM','Saturday, Oct 3 • 9:00 AM'];
              if(i===7)arr=['Dispatch today • 1–3 PM','Dispatch today • 3–5 PM','First available technician today'];"""

          old_reply = """  if(step===2)data.city=text;
            if(step===3)data.address=text;
            if(step===4)data.name=text.replace(/^(my name is|it is|it's|je m'appelle|mon nom est)\\s+/i,'');
            if(step===5)data.appt=normalizeAppointment(text);
            if(step===6)data.appt=text;
            quick.innerHTML=''; $('answer').value='';
            if(step===5||step===6){playFinal();return;}
            if(step===4&&data.urgency==='Emergency'){
              step=6;"""
          new_reply = """  if(step===2)data.city=text;
            if(step===3)data.address=text;
            if(step===4)data.phone=text;
            if(step===5)data.name=text.replace(/^(my name is|it is|it's|je m'appelle|mon nom est)\\s+/i,'');
            if(step===6)data.appt=normalizeAppointment(text);
            if(step===7)data.appt=text;
            quick.innerHTML=''; $('answer').value='';
            if(step===6||step===7){playFinal();return;}
            if(step===5&&data.urgency==='Emergency'){
              step=7;"""

          for name in pages:
              p = Path(name)
              s = p.read_text(encoding="utf-8")

              replacements = [
                  (old_prompts_en, new_prompts_en),
                  (old_prompts_fr, new_prompts_fr),
                  (old_audio_en, new_audio_en),
                  (old_audio_fr, new_audio_fr),
                  ("const data={issue:'—',urgency:'—',city:'—',address:'—',name:'—',appt:'—'};",
                   "const data={issue:'—',urgency:'—',city:'—',address:'—',phone:'—',name:'—',appt:'—'};"),
                  (old_choices_fr, new_choices_fr),
                  (old_choices_en, new_choices_en),
                  (old_reply, new_reply),
                  ("showChoices(6);", "showChoices(7);"),
                  ("<div class=\"cell\"><span>Address</span><b id=\"sAddress\">—</b></div><div class=\"cell\"><span>Name</span><b id=\"sName\">—</b></div>",
                   "<div class=\"cell\"><span>Address</span><b id=\"sAddress\">—</b></div><div class=\"cell\"><span>Phone</span><b id=\"sPhone\">—</b></div><div class=\"cell\"><span>Name</span><b id=\"sName\">—</b></div>"),
                  ("$('sAddress').textContent=data.address; $('sName').textContent=data.name; $('sAppt').textContent=data.appt;",
                   "$('sAddress').textContent=data.address; $('sPhone').textContent=data.phone; $('sName').textContent=data.name; $('sAppt').textContent=data.appt;")
              ]

              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f"Expected block missing in {name}: {old[:80]}")
                  s = s.replace(old, new)

              if '"Address":"Adresse","Name":"Nom"' in s:
                  s = s.replace('"Address":"Adresse","Name":"Nom"', '"Address":"Adresse","Phone":"Téléphone","Name":"Nom"')

              checks = [
                  "best phone number to reach you",
                  "meilleur numéro de téléphone",
                  "audio/lux-phone.mp3?v=20261001p",
                  "audio/fr-phone.mp3?v=20261001p",
                  "phone:'—'",
                  'id="sPhone"',
                  "if(step===4)data.phone=text",
                  "step=7;",
                  "showChoices(7);"
              ]
              for check in checks:
                  if check not in s:
                      raise SystemExit(f"Validation failed in {name}: {check}")

              p.write_text(s, encoding="utf-8")
          PY

      - name: Commit phone capture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-phone-capture.yml
          git add -A
          git commit -m "Add phone number to Ava booking flow" || exit 0
          git push
