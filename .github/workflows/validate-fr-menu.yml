name: Validate French menu audio
on:
  push:
    paths:
      - '.github/workflows/validate-fr-menu.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect audio
        shell: bash
        run: |
          set -euo pipefail
          ls -l audio/fr-menu.mp3
          file audio/fr-menu.mp3
          python - <<'PY'
          p='audio/fr-menu.mp3'
          with open(p,'rb') as f:
              b=f.read(32)
          print('HEAD_HEX',b.hex())
          print('HEAD_ASCII',repr(b))
          PY
          ffprobe -v error -show_entries format=format_name,duration,size -of default=nw=1 audio/fr-menu.mp3
